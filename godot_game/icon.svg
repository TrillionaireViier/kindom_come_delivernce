<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1f18"/>
      <stop offset="100%" stop-color="#100b08"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d070"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6e1a"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#b0b5bc"/>
      <stop offset="100%" stop-color="#5a6068"/>
    </linearGradient>
  </defs>
  
  <!-- Shield Background -->
  <path d="M 64 8 C 96 8 116 16 116 48 C 116 88 64 120 64 120 C 64 120 12 88 12 48 C 12 16 32 8 64 8 Z" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <path d="M 64 16 C 90 16 106 23 106 50 C 106 82 64 110 64 110 C 64 110 22 82 22 50 C 22 23 38 16 64 16 Z" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.6"/>
  
  <!-- Crossed Broadswords -->
  <g transform="translate(64, 60)">
    <!-- Sword 1: Top-Left to Bottom-Right -->
    <g transform="rotate(45)">
      <rect x="-3" y="-45" width="6" height="65" fill="url(#steelGrad)"/>
      <polygon points="0,-52 -3,-45 3,-45" fill="#ffffff"/>
      <rect x="-14" y="20" width="28" height="4" rx="2" fill="url(#goldGrad)"/>
      <rect x="-2" y="24" width="4" height="14" fill="#50301a"/>
      <circle cx="0" cy="40" r="5" fill="url(#goldGrad)"/>
    </g>
    <!-- Sword 2: Top-Right to Bottom-Left -->
    <g transform="rotate(-45)">
      <rect x="-3" y="-45" width="6" height="65" fill="url(#steelGrad)"/>
      <polygon points="0,-52 -3,-45 3,-45" fill="#ffffff"/>
      <rect x="-14" y="20" width="28" height="4" rx="2" fill="url(#goldGrad)"/>
      <rect x="-2" y="24" width="4" height="14" fill="#50301a"/>
      <circle cx="0" cy="40" r="5" fill="url(#goldGrad)"/>
    </g>
  </g>
  
  <!-- Central Emblem / Red Wax Stamp with Cross -->
  <circle cx="64" cy="62" r="16" fill="#8b1e17" stroke="url(#goldGrad)" stroke-width="2"/>
  <path d="M 64 52 L 64 72 M 54 60 L 74 60" stroke="#f7d070" stroke-width="3" stroke-linecap="round"/>
</svg>
